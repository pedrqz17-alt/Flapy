name: Exportar APK
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot e Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Criar assinatura e arrumar preset
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          python3 -c "
          import pathlib, re
          p = pathlib.Path('export_presets.cfg')
          t = p.read_text()
          # 1. Assinatura
          t = t.replace('keystore/debug=\"\"', 'keystore/debug=\"debug.keystore\"')
          t = t.replace('keystore/debug_user=\"\"', 'keystore/debug_user=\"androiddebugkey\"')
          t = t.replace('keystore/debug_password=\"\"', 'keystore/debug_password=\"android\"')
          # 2. Nome do pacote - o que estava faltando
          # Se já tem uma linha application/config/name, troca ela
          if 'application/config/name=' in t:
              t = re.sub(r'application/config/name=\".*?\"', 'application/config/name=\"com.pedrqz.flappy\"', t)
          else:
              t += '\napplication/config/name=\"com.pedrqz.flappy\"\n'
          # Garante que a assinatura existe mesmo se as linhas não existiam
          if 'keystore/debug=' not in t:
              t += '\nkeystore/debug=\"debug.keystore\"\nkeystore/debug_user=\"androiddebugkey\"\nkeystore/debug_password=\"android\"\n'
          p.write_text(t)
          print(p.read_text())
          "

      - name: Exportar APK
        run: |
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-debug "Android" flappy.apk
          ls -lh flappy.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-apk
          path: flappy.apk
          if-no-files-found: error
