name: Exportar APK
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4

      - name: Criar assinatura e preset mínimo
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patch_list=PackedStringArray()
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory="res://android/build"
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.pedrqz.flappy"
          package/name="Flappy"
          package/signed=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF
          cat export_presets.cfg
          echo "--- SDK ---"
          echo $ANDROID_HOME
          ls $ANDROID_HOME/build-tools/

      - name: Instalar template Android e Exportar APK
        run: |
          godot --headless --install-android-build-template || true
          godot --headless --export-debug "Android" flappy.apk
          ls -lh flappy.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-apk
          path: flappy.apk
          if-no-files-found: error
